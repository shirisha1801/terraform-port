name: Create S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Bucket Name"
        required: true
        type: string

      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2

permissions:
  contents: write

# Prevent two Port requests from editing the bucket file simultaneously.
concurrency:
  group: terraform-s3-port-lab
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get Latest Configuration
        run: |
          git pull --ff-only origin main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform Cloud
        run: |
          cat > ~/.terraformrc <<EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      # ---------------------------------------------------------
      # Add new Port request WITHOUT removing previous buckets
      # ---------------------------------------------------------
      - name: Add New Bucket To Configuration
        working-directory: ./s3
        env:
          BUCKET_NAME: ${{ github.event.inputs.bucket_name }}
          AWS_REGION: ${{ github.event.inputs.aws_region }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          filename = "terraform.tfvars.json"

          bucket_name = os.environ["BUCKET_NAME"].strip()
          aws_region = os.environ["AWS_REGION"].strip()

          allowed_regions = {
              "us-east-1",
              "us-east-2",
              "us-west-1",
              "us-west-2"
          }

          if aws_region not in allowed_regions:
              print(f"Unsupported region: {aws_region}")
              sys.exit(1)

          try:
              with open(filename, "r") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {"buckets": {}}

          if "buckets" not in data:
              data["buckets"] = {}

          if bucket_name in data["buckets"]:
              old_region = data["buckets"][bucket_name]["region"]

              if old_region != aws_region:
                  print(
                      f"ERROR: Bucket '{bucket_name}' is already "
                      f"configured in '{old_region}'."
                  )
                  sys.exit(1)

              print(
                  f"Bucket '{bucket_name}' already exists "
                  f"in configuration."
              )

          else:
              data["buckets"][bucket_name] = {
                  "region": aws_region
              }

              print(
                  f"Adding '{bucket_name}' in '{aws_region}'."
              )

          with open(filename, "w") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")

          print("\nFinal bucket configuration:")
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      # ---------------------------------------------------------
      # IMPORTANT DEBUG CHECK
      # ---------------------------------------------------------
      - name: Show Final Bucket Configuration
        working-directory: ./s3
        run: |
          echo "=========================================="
          echo "terraform.tfvars.json used for this run:"
          echo "=========================================="
          cat terraform.tfvars.json
          echo "=========================================="

      - name: Terraform Init
        working-directory: ./s3
        run: terraform init

      - name: Terraform Validate
        working-directory: ./s3
        run: terraform validate

      # ---------------------------------------------------------
      # Check plan before Apply
      # ---------------------------------------------------------
      - name: Terraform Plan
        working-directory: ./s3
        run: |
          terraform plan

      - name: Terraform Apply
        working-directory: ./s3
        run: |
          terraform apply -auto-approve

      # ---------------------------------------------------------
      # Persist successful bucket request for next Port run
      # ---------------------------------------------------------
      - name: Save Bucket Configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add s3/terraform.tfvars.json

          if git diff --cached --quiet; then
            echo "No configuration changes to save."
          else
            git commit \
              -m "Add S3 bucket ${{ github.event.inputs.bucket_name }}"

            git push origin main
          fi
