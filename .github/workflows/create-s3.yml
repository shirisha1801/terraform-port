name: Create S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Bucket Name"
        required: true
        type: string

      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2

permissions:
  contents: write

# Prevent two requests from modifying terraform.tfvars.json
# at the same time.
concurrency:
  group: s3-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform Cloud
        run: |
          cat > ~/.terraformrc <<EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      # ---------------------------------------------------------
      # Add the new Port input to the existing bucket list
      # ---------------------------------------------------------

      - name: Add New Bucket
        working-directory: ./s3
        env:
          BUCKET_NAME: ${{ github.event.inputs.bucket_name }}
          AWS_REGION: ${{ github.event.inputs.aws_region }}
        run: |
          python3 - <<'PY'
          import json
          import os

          filename = "terraform.tfvars.json"

          bucket_name = os.environ["BUCKET_NAME"]
          aws_region = os.environ["AWS_REGION"]

          allowed_regions = {
              "us-east-1",
              "us-east-2",
              "us-west-1",
              "us-west-2"
          }

          if aws_region not in allowed_regions:
              raise Exception(
                  f"Unsupported AWS region: {aws_region}"
              )

          try:
              with open(filename, "r") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {"buckets": {}}

          if "buckets" not in data:
              data["buckets"] = {}

          # Do not accidentally move an existing bucket
          # to another region.
          if bucket_name in data["buckets"]:
              existing_region = \
                  data["buckets"][bucket_name]["region"]

              if existing_region != aws_region:
                  raise Exception(
                      f"Bucket '{bucket_name}' already exists "
                      f"in configuration with region "
                      f"'{existing_region}'."
                  )

              print(
                  f"Bucket '{bucket_name}' is already "
                  f"in the configuration."
              )

          else:
              data["buckets"][bucket_name] = {
                  "region": aws_region
              }

          with open(filename, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("Final bucket configuration:")
          print(json.dumps(data, indent=2))
          PY

      # ---------------------------------------------------------
      # Terraform
      # ---------------------------------------------------------

      - name: Terraform Init
        working-directory: ./s3
        run: terraform init

      - name: Terraform Validate
        working-directory: ./s3
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./s3
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./s3
        run: terraform apply -auto-approve tfplan

      # ---------------------------------------------------------
      # Persist the updated bucket list
      # ---------------------------------------------------------

      - name: Save Bucket Configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add s3/terraform.tfvars.json

          if git diff --cached --quiet; then
            echo "No bucket configuration changes."
          else
            git commit \
              -m "Add S3 bucket ${{ github.event.inputs.bucket_name }}"

            git push origin main
          fi
