name: Create S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Bucket Name"
        required: true
        type: string

      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform Cloud
        run: |
          cat > ~/.terraformrc <<EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: ./s3
        run: terraform init

      # Get all S3 buckets already managed by this Terraform state
      - name: Get Existing Buckets
        working-directory: ./s3
        run: |
          terraform state pull > current-state.json

          jq '
            [
              .resources[]?
              | select(.type == "aws_s3_bucket")
              | .instances[]?
              | {
                  key: .attributes.bucket,
                  value: {
                    region: (.attributes.region // "us-east-1")
                  }
                }
              | select(.key != null)
            ]
            | from_entries
          ' current-state.json > existing-buckets.json

          echo "Existing buckets:"
          cat existing-buckets.json

      # Add the new Port input to the existing bucket map
      - name: Build Bucket Configuration
        working-directory: ./s3
        env:
          BUCKET_NAME: ${{ github.event.inputs.bucket_name }}
          AWS_REGION: ${{ github.event.inputs.aws_region }}
        run: |
          jq \
            --arg bucket "$BUCKET_NAME" \
            --arg region "$AWS_REGION" \
            '{
              buckets: (
                . + {
                  ($bucket): {
                    region: $region
                  }
                }
              ),
              aws_region: $region
            }' \
            existing-buckets.json > terraform.tfvars.json

          echo "Final Terraform variables:"
          cat terraform.tfvars.json

      - name: Terraform Plan
        working-directory: ./s3
        run: |
          terraform plan \
            -var-file="terraform.tfvars.json"

      - name: Terraform Apply
        working-directory: ./s3
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars.json"
